# docker compose up --build
# API on http://localhost:8080 (Swagger UI: /swagger-ui.html), demo receiver on http://localhost:9090
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
    ports:
      - "5433:5432" # 5433 on the host so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/webhooks
      DATABASE_USERNAME: webhooks
      DATABASE_PASSWORD: webhooks
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-key-change-me}
      # the demo receiver is a container on this network, which the SSRF check would block
      ALLOW_PRIVATE_URLS: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # a fake customer server with good, flaky, slow and broken URLs (see demo-receiver/DemoReceiver.java)
  demo-receiver:
    build: ./demo-receiver
    ports:
      - "9090:9090"

volumes:
  pgdata:
