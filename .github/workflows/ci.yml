name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # unit tests (surefire) + integration tests against PostgreSQL in Testcontainers (failsafe) + coverage
      - name: Build, test and coverage report
        run: ./mvnw -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t webhook-delivery-service:${{ github.sha }} .
      - name: Build the demo receiver
        run: docker build -t demo-receiver:${{ github.sha }} demo-receiver
